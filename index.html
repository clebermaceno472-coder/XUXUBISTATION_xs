<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>XUXUBISTATION XS</title>
  <style>
    :root{
      --bg:#050505;
      --fg:#f2f2f2;
      --muted:rgba(245,245,245,.55);
      --muted2:rgba(245,245,245,.36);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden}
    body{font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;}

    /* Ambient */
    body::before{
      content:"";
      position:fixed; inset:-80px;
      background:
        radial-gradient(1200px 800px at 50% 45%, rgba(255,255,255,.06), transparent 62%),
        radial-gradient(900px 600px at 15% 25%, rgba(255,255,255,.035), transparent 60%),
        radial-gradient(900px 600px at 85% 25%, rgba(255,255,255,.03), transparent 60%),
        linear-gradient(#000, #000);
      filter: contrast(1.05);
      pointer-events:none;
    }
    body::after{
      content:"";
      position:fixed; inset:0;
      background:
        radial-gradient(circle at 50% 50%, transparent 55%, rgba(0,0,0,.78) 100%),
        repeating-linear-gradient(to bottom,
          rgba(255,255,255,.05) 0px,
          rgba(255,255,255,.05) 1px,
          transparent 3px,
          transparent 7px
        );
      opacity:.20;
      mix-blend-mode: overlay;
      pointer-events:none;
      animation: drift 2.2s linear infinite;
    }
    @keyframes drift{ to{ transform: translateY(12px); } }

    .wrap{
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:14px;
      padding:18px 16px 26px;
    }

    /* Title */
    .title{
      width:min(1080px, 96vw);
      text-align:center;
      margin-bottom:2px;
      position:relative;
      user-select:none;
    }
    .title h1{
      margin:0;
      font-family: Impact, "Arial Black", system-ui, sans-serif;
      font-weight:900;
      letter-spacing:3px;
      font-size: clamp(22px, 4.2vw, 40px);
      color: rgba(255,255,255,.94);
      text-transform:uppercase;
      text-shadow:
        0 2px 0 rgba(0,0,0,.95),
        0 0 18px rgba(255,255,255,.10),
        0 0 46px rgba(255,255,255,.06);
      -webkit-text-stroke: 1px rgba(0,0,0,.65);
    }
    /* Glitch twin layers */
    .title h1::before,
    .title h1::after{
      content: attr(data-text);
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      top:0;
      width:100%;
      pointer-events:none;
      opacity:0;
    }
    .title h1::before{
      color: rgba(255,255,255,.18);
      text-shadow: none;
      animation: tglitch1 3.2s infinite;
      clip-path: inset(0 0 55% 0);
    }
    .title h1::after{
      color: rgba(255,255,255,.10);
      animation: tglitch2 3.2s infinite;
      clip-path: inset(45% 0 0 0);
    }
    @keyframes tglitch1{
      0%, 86%, 100%{ opacity:0; transform:translateX(-50%) translateY(0); }
      88%{ opacity:.95; transform:translateX(calc(-50% - 2px)) translateY(1px); }
      90%{ opacity:.75; transform:translateX(calc(-50% + 2px)) translateY(-1px); }
      92%{ opacity:0; }
    }
    @keyframes tglitch2{
      0%, 86%, 100%{ opacity:0; transform:translateX(-50%) translateY(0); }
      89%{ opacity:.85; transform:translateX(calc(-50% + 3px)) translateY(0); }
      91%{ opacity:.65; transform:translateX(calc(-50% - 2px)) translateY(1px); }
      93%{ opacity:0; }
    }

    /* Banner */
    .banner{
      width:min(1080px, 96vw);
      aspect-ratio: 1536 / 625;
      max-height: 50vh;
      min-height: 200px;
      border-radius:18px;
      overflow:hidden;
      position:relative;
      background:#000;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.10),
        0 20px 78px rgba(0,0,0,.85),
        0 0 44px rgba(255,255,255,.06);
      transform: translateZ(0);
    }
    .banner img{
      width:100%; height:100%;
      object-fit:cover;
      object-position:center;
      display:block;
      filter: grayscale(1) contrast(1.15) brightness(.95);
      transform: scale(1.02);
    }
    .scan{
      position:absolute; inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 50% 50%, transparent 58%, rgba(0,0,0,.65) 100%),
        repeating-linear-gradient(to bottom,
          rgba(255,255,255,.09) 0px,
          rgba(255,255,255,.09) 1px,
          transparent 3px,
          transparent 7px
        );
      opacity:.22;
      mix-blend-mode: overlay;
      z-index:6;
    }
    canvas#fx{
      position:absolute; inset:0;
      width:100%; height:100%;
      z-index:5;
      pointer-events:none;
    }

    /* Play button */
    .play{
      appearance:none;
      border:0;
      cursor:pointer;
      width:min(420px, 90vw);
      padding:16px 18px;
      border-radius:14px;
      font-weight:900;
      letter-spacing:2.6px;
      text-transform:uppercase;
      color:#000;
      background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(232,232,232,.92));
      box-shadow:
        0 18px 56px rgba(0,0,0,.75),
        0 0 0 1px rgba(255,255,255,.14) inset,
        0 0 34px rgba(255,255,255,.06);
      position:relative;
      overflow:hidden;
      transition: transform .12s ease, filter .12s ease;
    }
    .play:hover{ transform: translateY(-1px); filter: contrast(1.06); }
    .play:active{ transform: translateY(0) scale(.99); }
    .play::before{
      content:"";
      position:absolute; inset:-40% -30%;
      background: linear-gradient(90deg, transparent, rgba(0,0,0,.12), transparent);
      transform: rotate(18deg) translateX(-80%);
      opacity:.9;
    }
    .play:hover::before{ animation: shine .75s ease forwards; }
    @keyframes shine{ to{ transform: rotate(18deg) translateX(120%); } }
    .play.glitch{ animation: btnGlitch .28s steps(2,end) 1; }
    @keyframes btnGlitch{
      0%{ transform:translateX(0); filter:contrast(1); }
      25%{ transform:translateX(-2px); filter:contrast(1.25); }
      55%{ transform:translateX(2px); filter:contrast(1.10); }
      100%{ transform:translateX(0); filter:contrast(1); }
    }

    /* Supporters */
    .support{
      width:min(980px, 92vw);
      text-align:center;
      font-size:12px;
      letter-spacing:.6px;
      color: var(--muted2);
      line-height:1.45;
      text-shadow: 0 1px 0 rgba(0,0,0,.9);
      user-select:text;
      margin-top:6px;
    }
    .support .title2{
      display:block;
      margin-bottom:6px;
      color: var(--muted);
      letter-spacing:1.2px;
      text-transform:uppercase;
      font-weight:700;
      font-size:11px;
    }

    .supportRow{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
    }
    .support a{
      color: rgba(245,245,245,.72);
      text-decoration:none;
      border-bottom:1px solid rgba(255,255,255,.14);
    }
    .support a:hover{ border-bottom-color: rgba(255,255,255,.45); }

    /* Micro text glitch */
    .support .line{
      position:relative;
      display:inline-block;
      padding:2px 8px;
    }
    .support .line::after{
      content: attr(data-glitch);
      position:absolute;
      left:0; top:0;
      width:100%;
      opacity:0;
      color: rgba(255,255,255,.12);
      animation: textGlitch 3.2s infinite;
      pointer-events:none;
      clip-path: inset(0 0 55% 0);
      transform: translate(0,0);
    }
    @keyframes textGlitch{
      0%, 88%, 100%{ opacity:0; transform:translate(0,0); }
      90%{ opacity:.9; transform:translate(-2px,1px); clip-path: inset(0 0 55% 0); }
      92%{ opacity:.7; transform:translate(2px,-1px); clip-path: inset(45% 0 0 0); }
      94%{ opacity:0; }
    }

    /* Skull (tiny) */
    .skull{
      width:22px;
      height:22px;
      opacity:.78;
      filter: drop-shadow(0 1px 0 rgba(0,0,0,.9)) drop-shadow(0 0 10px rgba(255,255,255,.06));
    }
    .jaw{
      transform-origin: 16px 20px;
      animation: chomp .8s ease-in-out infinite;
    }
    @keyframes chomp{
      0%, 100% { transform: translateY(0px) scaleY(1); }
      50% { transform: translateY(2.2px) scaleY(0.78); }
    }

    @media (max-width:480px){
      .banner{ max-height: 42vh; border-radius:16px; }
      .play{ letter-spacing:2.2px; }
      .skull{ width:20px; height:20px; }
    }
  </style>

  <link rel="prefetch" href="xuxunet.firebase.json" as="fetch" crossorigin="anonymous" />
</head>
<body>
  <main class="wrap">
    <header class="title">
      <h1 data-text="XUXUBISTATION XS">XUXUBISTATION XS</h1>
    </header>

    <section class="banner" aria-label="Imagem do projeto com glitch">
      <img id="bannerImg" src="banner.png" alt="Sync$ banner" />
      <canvas id="fx"></canvas>
      <div class="scan"></div>
    </section>

    <button id="playBtn" class="play" type="button">PLAY</button>

    <footer class="support">
      <span class="title2">Apoiadores do projeto</span>
      <div class="supportRow">
        <span class="line" data-glitch="Sync$: https://discord.com/invite/pqQm3QSft7">
          <strong style="color:rgba(245,245,245,.70); font-weight:800;">Sync$:</strong>
          <a href="https://discord.com/invite/pqQm3QSft7" target="_blank" rel="noopener noreferrer">
            https://discord.com/invite/pqQm3QSft7
          </a>
        </span>

        <!-- Caveirinha chomp -->
        <svg class="skull" viewBox="0 0 32 32" aria-hidden="true">
          <!-- head -->
          <path d="M16 3c6.3 0 11 4.5 11 10.3 0 3.9-2 6.7-4.1 8.3V26c0 1.1-.9 2-2 2h-2v-2.2c0-.7-.6-1.3-1.3-1.3h-3.2c-.7 0-1.3.6-1.3 1.3V28h-2c-1.1 0-2-.9-2-2v-4.4C5 20 3 17.2 3 13.3 3 7.5 9.7 3 16 3Z"
                fill="rgba(255,255,255,.82)"/>
          <!-- eyes -->
          <circle cx="11.5" cy="13.7" r="2.1" fill="rgba(0,0,0,.85)"/>
          <circle cx="20.5" cy="13.7" r="2.1" fill="rgba(0,0,0,.85)"/>
          <!-- nose -->
          <path d="M16 15.5l1.5 2.6c.3.6-.1 1.2-.7 1.2h-1.6c-.6 0-1-.6-.7-1.2L16 15.5Z" fill="rgba(0,0,0,.75)"/>

          <!-- jaw group -->
          <g class="jaw">
            <path d="M10 21.5h12c1.6 0 2.7 1.2 2.5 2.7l-.5 3.4c-.2 1.3-1.3 2.3-2.6 2.3H11c-1.3 0-2.4-1-2.6-2.3l-.5-3.4c-.2-1.5.9-2.7 2.5-2.7Z"
                  fill="rgba(245,245,245,.80)"/>
            <!-- teeth -->
            <path d="M12 23.2h2v2.5h-2zm3 0h2v2.5h-2zm3 0h2v2.5h-2zm3 0h2v2.5h-2z"
                  fill="rgba(0,0,0,.35)"/>
          </g>
        </svg>
      </div>
    </footer>
  </main>

<script>
  const CONSOLE_PAGE = "console_filmes_v7-2_XUXUNET_v5_autoconfig.html";
  const bannerImg = document.getElementById("bannerImg");
  const canvas = document.getElementById("fx");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  const playBtn = document.getElementById("playBtn");

  const FALLBACKS = ["banner.jpg","banner.jpeg","banner.webp","Banner.png","Banner.jpg","sync.png","sync.jpg"];
  bannerImg.addEventListener("error", () => {
    const next = FALLBACKS.shift();
    if(next) bannerImg.src = next;
  });

  function fit(){
    const r = bannerImg.getBoundingClientRect();
    canvas.width = Math.max(2, Math.floor(r.width));
    canvas.height = Math.max(2, Math.floor(r.height));
  }
  window.addEventListener("resize", fit);

  const sparks = [];
  function spawnSpark(){
    const w = canvas.width, h = canvas.height;
    const x = Math.random()*w;
    const y = Math.random()*h*0.35;
    const ang = (Math.random()*Math.PI*0.35) + Math.PI*0.15;
    const spd = 8 + Math.random()*22;
    const vx = Math.cos(ang)*spd * (Math.random()<0.5?-1:1);
    const vy = Math.sin(ang)*spd;
    sparks.push({ x,y, px:x-vx*.5, py:y-vy*.5, vx,vy, life:10+Math.random()*18, w:1+Math.random()*2.2, a:.75+Math.random()*.25 });
  }

  function drawFX(){
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0,0,w,h);

    // subtle tears / blocks
    const sliceCount = 5 + (Math.random()*4|0);
    for(let i=0;i<sliceCount;i++){
      const sh = (6 + Math.random()*18)|0;
      const sy = (Math.random()*(h-sh))|0;
      ctx.fillStyle = "rgba(255,255,255,.03)";
      ctx.fillRect(0, sy, w, sh);
    }

    // sparks
    const spawnN = (Math.random()<0.55) ? (1 + (Math.random()*2|0)) : 0;
    for(let i=0;i<spawnN;i++) spawnSpark();

    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.lineCap = "round";

    for(let i=sparks.length-1; i>=0; i--){
      const s = sparks[i];
      s.px = s.x; s.py = s.y;
      s.vx *= 0.88;
      s.vy = s.vy*0.90 + 0.85;
      s.x += s.vx; s.y += s.vy;
      s.life -= 1; s.a *= 0.92;

      const alpha = Math.max(0, Math.min(1, s.a));
      ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
      ctx.lineWidth = s.w;

      ctx.beginPath();
      ctx.moveTo(s.px, s.py);
      ctx.lineTo(s.x, s.y);
      ctx.stroke();

      if(Math.random() < 0.22){
        ctx.strokeStyle = `rgba(220,220,220,${alpha*0.65})`;
        ctx.lineWidth = Math.max(1, s.w-0.5);
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x + (Math.random()*10-5), s.y + (Math.random()*10-2));
        ctx.stroke();
      }

      if(s.life <= 0 || s.a < 0.03 || s.x < -60 || s.x > w+60 || s.y > h+80){
        sparks.splice(i,1);
      }
    }
    ctx.restore();

    // occasional flash
    if(Math.random() < 0.02){
      ctx.globalCompositeOperation="difference";
      ctx.fillStyle="rgba(255,255,255,.25)";
      ctx.fillRect(0,0,w,h);
      ctx.globalCompositeOperation="source-over";
    }
  }

  // sound
  let AC = null;
  function playGlitchSound(){
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const ac = AC;
    const now = ac.currentTime;

    const bufferSize = Math.max(1, Math.floor(ac.sampleRate * 0.30));
    const buf = ac.createBuffer(1, bufferSize, ac.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<bufferSize;i++){
      const base = (Math.random()*2-1);
      d[i] = base * (Math.random() < 0.14 ? 1 : 0.32);
    }
    const noise = ac.createBufferSource(); noise.buffer = buf;

    const bp = ac.createBiquadFilter(); bp.type="bandpass";
    bp.frequency.setValueAtTime(980, now); bp.Q.setValueAtTime(2.1, now);

    const hp = ac.createBiquadFilter(); hp.type="highpass";
    hp.frequency.setValueAtTime(180, now);

    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.22, now + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);

    const osc = ac.createOscillator(); osc.type="square";
    osc.frequency.setValueAtTime(460, now);
    osc.frequency.exponentialRampToValueAtTime(2400, now + 0.035);
    osc.frequency.exponentialRampToValueAtTime(540, now + 0.12);

    const og = ac.createGain();
    og.gain.setValueAtTime(0.0001, now);
    og.gain.exponentialRampToValueAtTime(0.10, now + 0.006);
    og.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);

    noise.connect(bp); bp.connect(hp); hp.connect(g); g.connect(ac.destination);
    osc.connect(og); og.connect(ac.destination);

    bp.frequency.setValueAtTime(1050, now);
    bp.frequency.exponentialRampToValueAtTime(2800, now + 0.03);
    bp.frequency.exponentialRampToValueAtTime(850, now + 0.14);

    noise.start(now); noise.stop(now + 0.25);
    osc.start(now); osc.stop(now + 0.18);
  }

  function raf(){
    drawFX();
    requestAnimationFrame(raf);
  }

  bannerImg.addEventListener("load", ()=>{ fit(); });
  setTimeout(fit, 60);
  requestAnimationFrame(raf);

  playBtn.addEventListener("click", ()=>{
    playBtn.classList.add("glitch");
    playGlitchSound();
    setTimeout(()=>playBtn.classList.remove("glitch"), 320);
    setTimeout(()=>{ location.href = CONSOLE_PAGE; }, 120);
  });
</script>
</body>
</html>
